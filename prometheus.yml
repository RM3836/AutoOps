# Prometheus 主配置
global:
  scrape_interval: 15s      # 每 15 秒抓取一次指标
  evaluation_interval: 15s  # 每 15 秒评估一次告警规则

# 加载告警规则文件
rule_files:
  - "/etc/prometheus/alert.rules.yml"

# 抓取目标
scrape_configs:
  - job_name: "autoops"
    static_configs:
      - targets: ["autoops:5000"]
    metrics_path: "/metrics"
