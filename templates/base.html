<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AutoOps{% endblock %} - 自动化运维管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">AutoOps</a>
            <div class="navbar-nav">
                <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">仪表盘</a>
                <a class="nav-link {% if request.path == '/server' %}active{% endif %}" href="/server">服务器</a>
                <a class="nav-link {% if request.path == '/ssh' %}active{% endif %}" href="/ssh">SSH运维</a>
                <a class="nav-link {% if request.path == '/logs' %}active{% endif %}" href="/logs">日志分析</a>
                <a class="nav-link {% if request.path == '/alerts' %}active{% endif %}" href="/alerts">告警中心</a>
                <a class="nav-link {% if request.path == '/tools' %}active{% endif %}" href="/tools">工具箱</a>
            </div>
            <span class="navbar-text text-muted" id="clock"></span>
        </div>
    </nav>

    <div class="container-fluid mt-3">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="/static/js/common.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
